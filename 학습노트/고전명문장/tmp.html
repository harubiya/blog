人一定要想么？活着就要想。睡觉作梦，也还在“想”：在梦中吃饭做事，
奋搏逃奔，离合悲欢。这不就是“想”么？“至人无梦”，这“至人”当是一念
不生，一尘不想，免除和杀死一切想、梦的人？杀死之后，又仍活着，便如行尸走肉，不如真的自杀。
但并非每个人都会自杀。恰好相反，实际是每个人都在活着。活着就要吃饭
穿衣，就有事务缠身，便被扔掷在这个世界中，衣食住行，与人共在，从而打交
道，结恩怨，得因果，忧乐相侵，苦甜相扰。尽管你可以彻底排遣，精神解放，
“境忘心自灭，心灭境无侵”。但这解放、排遣、“忘灭”本身，其所以必要和可能，
不又仍然是人们努力“想”的结果么？
